apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true

  - name: Loki
    type: loki
    url: http://loki:3100
    access: proxy

  - name: Tempo
    type: tempo
    url: http://tempo:3200
    access: proxy

  - name: MySQL
    type: mysql
    url: host.docker.internal:3306
    database: oh
    user: ${MYSQL_USER}
    secureJsonData:
      password: ${MYSQL_PASSWORD}
