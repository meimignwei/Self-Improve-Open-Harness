version: "3.8"

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: oh-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.0
    container_name: oh-loki
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    command: "-config.file=/etc/loki/loki-config.yml"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.5.0
    container_name: oh-tempo
    ports:
      - "3200:3200"
      - "4317:4317"
    volumes:
      - ./config/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo_data:/var/tempo
    command: "-config.file=/etc/tempo/tempo-config.yml"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: oh-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./dashboards/openharness-dashboard.json:/etc/grafana/provisioning/dashboards/openharness.json:ro
      - ./dashboards/dashboard-provider.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
